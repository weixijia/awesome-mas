<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256">
  <!-- Cartoon sticker in the spirit of Ross mid "WE WERE ON A BREAK!!" — an illustration, not a likeness -->
  <defs>
    <g id="silhouette">
      <path d="M40 256 C46 214 80 196 128 194 C176 196 210 214 216 256 Z"/>
      <ellipse cx="70" cy="128" rx="13" ry="18"/>
      <ellipse cx="186" cy="128" rx="13" ry="18"/>
      <ellipse cx="128" cy="124" rx="58" ry="70"/>
      <path d="M62 122 C52 64 92 30 134 32 C180 34 208 68 194 122 L186 122 C184 98 178 86 168 80 C146 88 108 88 88 76 C80 88 74 102 72 122 Z"/>
    </g>
  </defs>

  <!-- drop shadow + die-cut white border -->
  <g transform="translate(3 5)" fill="#000" stroke="#000" stroke-width="20" stroke-linejoin="round" opacity="0.18">
    <use href="#silhouette"/>
  </g>
  <g fill="#fff" stroke="#fff" stroke-width="20" stroke-linejoin="round">
    <use href="#silhouette"/>
  </g>

  <!-- sweater + shirt collar -->
  <path d="M40 256 C46 214 80 196 128 194 C176 196 210 214 216 256 Z" fill="#4E6A8E"/>
  <path d="M96 200 L128 236 L160 200 C150 196 140 194 128 194 C116 194 106 196 96 200 Z" fill="#F4F1EA"/>
  <path d="M106 197 L128 222 L150 197" fill="none" stroke="#2E405A" stroke-width="3" stroke-linejoin="round"/>
  <rect x="110" y="176" width="36" height="26" rx="10" fill="#E2AE86"/>

  <!-- ears -->
  <ellipse cx="70" cy="128" rx="13" ry="18" fill="#EDB990"/>
  <ellipse cx="186" cy="128" rx="13" ry="18" fill="#EDB990"/>
  <path d="M66 122 C72 124 72 134 68 138" fill="none" stroke="#C98C66" stroke-width="3" stroke-linecap="round"/>
  <path d="M190 122 C184 124 184 134 188 138" fill="none" stroke="#C98C66" stroke-width="3" stroke-linecap="round"/>

  <!-- face -->
  <ellipse cx="128" cy="124" rx="58" ry="70" fill="#F4C7A1"/>
  <!-- cheeks -->
  <ellipse cx="92" cy="146" rx="11" ry="7" fill="#EE9F86" opacity="0.55"/>
  <ellipse cx="164" cy="146" rx="11" ry="7" fill="#EE9F86" opacity="0.55"/>

  <!-- hair: neat side part, a bit of 90s volume, sideburns -->
  <path d="M62 122 C52 64 92 30 134 32 C180 34 208 68 194 122 L186 122 C184 98 178 86 168 80 C146 88 108 88 88 76 C80 88 74 102 72 122 Z" fill="#3A2417"/>
  <path d="M100 78 C98 64 102 52 110 44" fill="none" stroke="#5A3A26" stroke-width="3" stroke-linecap="round"/>
  <path d="M70 108 L74 134 L80 132 L78 104 Z" fill="#3A2417"/>
  <path d="M186 108 L182 134 L176 132 L178 104 Z" fill="#3A2417"/>

  <!-- exasperated eyebrows (raised at the middle) -->
  <path d="M86 100 C96 100 108 94 120 84" fill="none" stroke="#3A2417" stroke-width="8" stroke-linecap="round"/>
  <path d="M136 84 C148 94 160 100 170 100" fill="none" stroke="#3A2417" stroke-width="8" stroke-linecap="round"/>

  <!-- wide eyes -->
  <ellipse cx="105" cy="116" rx="11" ry="12" fill="#fff"/>
  <ellipse cx="151" cy="116" rx="11" ry="12" fill="#fff"/>
  <circle cx="107" cy="118" r="6" fill="#2A1A10"/>
  <circle cx="149" cy="118" r="6" fill="#2A1A10"/>
  <circle cx="109" cy="115" r="2" fill="#fff"/>
  <circle cx="151" cy="115" r="2" fill="#fff"/>

  <!-- nose -->
  <path d="M128 120 C124 132 122 140 128 144 C132 146 136 144 136 141" fill="none" stroke="#C98C66" stroke-width="4" stroke-linecap="round"/>

  <!-- shouting mouth -->
  <path d="M98 154 C108 148 148 148 158 154 C160 180 144 194 128 194 C112 194 96 180 98 154 Z" fill="#7A2E2A"/>
  <path d="M101 155 C112 151 144 151 155 155 L154 162 C142 158 114 158 102 162 Z" fill="#fff"/>
  <ellipse cx="128" cy="185" rx="16" ry="7" fill="#D96B6B"/>
</svg>
