<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>MAS Office · awesome-mas</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<header class="topbar">
  <div class="brand">
    <svg viewBox="0 0 32 32" width="30" height="30" aria-hidden="true"><circle cx="16" cy="16" r="15" fill="#E8735A"/><path d="M16 10 L9 21 M16 10 L23 21 M9 21 H23" stroke="#fff" stroke-width="2" stroke-linecap="round" opacity=".7"/><circle cx="16" cy="10" r="3.6" fill="#fff"/><circle cx="9" cy="21" r="3.2" fill="#FFE1A8"/><circle cx="23" cy="21" r="3.2" fill="#BFEDE5"/></svg>
    <span class="wordmark">awesome-mas</span>
  </div>
  <div class="proj"><div class="kicker">Project</div><div id="proj-title">Your project</div></div>
  <ol class="stepper" id="stepper" aria-label="Progress"></ol>
  <div class="conn" id="conn"></div>
  <div class="updated" id="updated"></div>
</header>
<nav class="subbar">
  <div class="tabs" role="tablist">
    <button class="tab" role="tab" data-view="design">Design</button>
    <button class="tab" role="tab" data-view="office">Office</button>
    <button class="tab" role="tab" data-view="result">Result</button>
  </div>
  <div class="next" id="next" aria-live="polite"></div>
</nav>
<main>
  <section class="view view-design" id="view-design" hidden>
    <aside class="d-left">
      <section class="card" id="task-card"></section>
      <section class="card" id="cost-card" hidden></section>
      <section class="card" id="why-card" hidden></section>
      <section class="card" id="lock-card" hidden></section>
      <section class="card" id="ask-card" hidden></section>
    </aside>
    <div class="map" id="map">
      <div class="map-tools">
        <b>Team map</b><span id="map-badge"></span><span class="map-hint" id="map-hint"></span>
        <span class="spacer"></span>
        <button class="btn btn-sm" id="add-role" hidden>＋ Add role</button>
        <button class="btn btn-sm btn-icon" id="zoom-out" title="Zoom out">−</button>
        <button class="btn btn-sm btn-icon" id="zoom-in" title="Zoom in">+</button>
        <button class="btn btn-sm" id="zoom-fit" title="Fit the whole team">Fit</button>
      </div>
      <div class="draft-bar" id="draft-bar" hidden>✏️ These edits only live in this page.
        <button class="btn btn-sm" id="draft-download">Download structure.md</button>
        <button class="btn btn-sm btn-ghost" id="draft-discard">Discard</button>
        <span class="small">Put it in your <code>mas/</code> folder and type <code>next</code>.</span>
      </div>
      <div class="map-world" id="map-world"></div>
      <div class="map-empty empty" id="map-empty" hidden></div>
      <div class="map-warn" id="map-warn"></div>
    </div>
    <aside class="d-right card" id="editor"></aside>
  </section>

  <section class="view view-office" id="view-office" hidden>
    <div class="office-host" id="office-host"></div>
    <div class="empty office-empty" id="office-empty" hidden></div>
    <div class="banner" id="office-banner" hidden>👀 Preview — lock your team to start work</div>
    <div class="office-tools"><span class="pill pill-demo" id="demo-badge" hidden>Demo</span><button class="btn btn-sm" id="replay" hidden>↺ Replay</button></div>
    <div class="legend" id="office-legend" hidden>
      <span><i class="state state-idle">idle</i> resting</span><span><i class="state state-waiting">waiting</i> at desk</span>
      <span><i class="state state-working">working</i></span><span><i class="state state-handoff">handoff</i> passing work</span>
      <span><i class="state state-flagged">flagged</i> found a problem</span><span><i class="state state-done">done</i></span>
      <span class="muted">Click a person for details</span>
    </div>
    <aside class="drawer card" id="drawer" hidden></aside>
  </section>

  <section class="view view-result" id="view-result" hidden><div class="result" id="result"></div></section>
</main>
<div class="toast" id="toast" role="status" hidden></div>
<script src="model.js"></script>
<script src="office.js"></script>
<script src="app.js"></script>
</body>
</html>
